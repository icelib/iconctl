name: Package consumer CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - packages/core/**
      - apps/cli/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/package-consumer.yml
  push:
    branches: [main]
    paths:
      - packages/core/**
      - apps/cli/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/package-consumer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    name: Packed consumer (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.4, 24.22.1]
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @iconctl/core test:package
