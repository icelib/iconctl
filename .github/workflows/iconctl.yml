name: iconctl publish

on:
  repository_dispatch:
    types: [iconctl-publish]
  workflow_dispatch:
    inputs:
      iconfont_url:
        description: Optional iconfont Symbol JS URL to ingest into packages/icons
        required: false
        type: string
      only:
        description: Optional comma-separated icon names to take from that URL
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build iconctl
        run: pnpm --filter @iconctl/core build && pnpm --filter iconctl build

      - name: Ingest iconfont
        if: github.event_name == 'workflow_dispatch' && inputs.iconfont_url != ''
        env:
          ICONFONT_URL: ${{ inputs.iconfont_url }}
          ICONFONT_ONLY: ${{ inputs.only }}
        run: |
          extra=()
          if [ -n "$ICONFONT_ONLY" ]; then
            extra+=(--only "$ICONFONT_ONLY")
          fi
          pnpm --filter @iconctl/icons add-iconfont --json -- "${extra[@]}" "$ICONFONT_URL" | tee /tmp/iconctl-sync.json

      - name: Sync icon package
        if: github.event_name != 'workflow_dispatch' || inputs.iconfont_url == ''
        run: pnpm --filter @iconctl/icons exec iconctl sync --json | tee /tmp/iconctl-sync.json

      - name: Write changeset
        run: |
          if [ ! -f /tmp/iconctl-sync.json ] || ! command -v jq >/dev/null; then
            echo "No sync JSON; skipping changeset"
            exit 0
          fi
          if [ "$(jq -r '((.added // []) + (.removed // []) + (.changed // [])) | length' /tmp/iconctl-sync.json)" = "0" ]; then
            echo "No icon diff; skipping changeset"
            exit 0
          fi
          mkdir -p .changeset
          printf '%s\n' '---' '"@iconctl/icons": patch' '---' '' 'Sync icons from iconctl.' > ".changeset/icons-${GITHUB_RUN_ID}.md"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add packages/icons .changeset
          if git diff --cached --quiet; then
            echo "No icon changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="iconctl/sync-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "chore: sync icons"
          git push -u origin "$branch"
          body="Automated icon sync from iconctl (${GITHUB_EVENT_NAME})."
          if [ -f /tmp/iconctl-sync.json ] && command -v jq >/dev/null; then
            body=$(jq -r '
              "## iconctl sync\n\n"
              + "- prefix: `\(.prefix)`\n"
              + "- added: " + ((.added // []) | join(", ")) + "\n"
              + "- removed: " + ((.removed // []) | join(", ")) + "\n"
              + "- changed: " + ((.changed // []) | join(", ")) + "\n"
            ' /tmp/iconctl-sync.json)
          fi
          gh pr create --title "chore: sync icons" --body "$body"
