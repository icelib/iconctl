name: Console CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  console:
    name: Worker and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUSKY: 0
      CI: true
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build console, runner and dependencies
        run: pnpm exec turbo run build --filter=@iconctl/console... --filter=@iconctl/console-runner... --filter=@iconctl/figma-plugin

      - name: Check console and runner types
        run: pnpm exec turbo run typecheck --filter=@iconctl/console --filter=@iconctl/console-runner --filter=@iconctl/console-contracts

      - name: Test runner and contracts
        run: pnpm exec vitest run --project=@iconctl/console-runner --project=@iconctl/console-contracts

      - name: Test assembled site output
        run: pnpm --filter @iconctl/console test:build

      # The Cloudflare test runtime uses the console's Vitest version.
      - name: Test Worker
        run: pnpm --filter @iconctl/console test:worker

      - name: Install Chromium
        run: pnpm --filter @iconctl/console exec playwright install --with-deps chromium

      - name: Test browser flows
        run: pnpm --filter @iconctl/console test:e2e --project=chromium

      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-browser-results
          path: apps/console/test-results/
          if-no-files-found: ignore
          retention-days: 7
