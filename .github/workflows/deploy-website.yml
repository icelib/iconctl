name: Deploy iconctl site

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'apps/console/**'
      - 'apps/console-runner/**'
      - 'packages/core/**'
      - 'packages/console-contracts/**'
      - pnpm-lock.yaml
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-iconctl-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs and private console
    if: ${{ vars.ICONCTL_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@iconctl/console... --filter=@iconctl/console-runner...
      - run: pnpm --filter @iconctl/console test:worker
      - name: Deploy unified Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @iconctl/console run deploy
