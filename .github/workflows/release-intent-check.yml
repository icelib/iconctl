name: Release Intent Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  release-intent:
    name: Require release intent for publishable changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Skip generated release PRs
        if: startsWith(github.head_ref, 'pnpm-release/') || startsWith(github.head_ref, 'release/pnpm-version')
        run: echo "Generated pnpm release PR detected; skipping validation"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ !startsWith(github.head_ref, 'pnpm-release/') && !startsWith(github.head_ref, 'release/pnpm-version') }}

      - name: Setup Node.js environment
        if: ${{ !startsWith(github.head_ref, 'pnpm-release/') && !startsWith(github.head_ref, 'release/pnpm-version') }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install workflow dependencies
        if: ${{ !startsWith(github.head_ref, 'pnpm-release/') && !startsWith(github.head_ref, 'release/pnpm-version') }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate release intent presence
        if: ${{ !startsWith(github.head_ref, 'pnpm-release/') && !startsWith(github.head_ref, 'release/pnpm-version') }}
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_HEAD_REF: ${{ github.head_ref }}
        run: node .github/auto-changeset/check.mjs
