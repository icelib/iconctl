# Copy this into the product repo as .github/workflows/iconctl.yml
# Secrets: FIGMA_CLIENT_ID, FIGMA_CLIENT_SECRET, FIGMA_REFRESH_TOKEN
# Use a CI OAuth app/account separate from local development.
# All workflows sharing this authorization must use the same concurrency group.
# The Figma plugin needs a separate fine-grained PAT with actions:write on this repo.
# Optional `paths` limits git add (this repo uses packages/icons).
# Optional `changeset: true` + `changeset-package: '@scope/icons'` for a publishable icon package.

name: iconctl publish

on:
  repository_dispatch:
    types: [iconctl-publish]
  workflow_dispatch:

concurrency:
  group: iconctl-figma-oauth
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: icelib/iconctl@v1
        with:
          figma-client-id: ${{ secrets.FIGMA_CLIENT_ID }}
          figma-client-secret: ${{ secrets.FIGMA_CLIENT_SECRET }}
          figma-refresh-token: ${{ secrets.FIGMA_REFRESH_TOKEN }}
          pr: true
