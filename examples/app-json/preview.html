<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>brand icons</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 24px; }
    h1 { font-size: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
    .icon { margin: 0; padding: 12px; border: 1px solid color-mix(in srgb, currentColor 16%, transparent); border-radius: 12px; }
    svg { display: block; margin: 0 auto 8px; }
    figcaption { font-size: 12px; text-align: center; word-break: break-all; }
  </style>
</head>
<body>
  <h1>brand · 2 icons</h1>
  <div class="grid">
        <figure class="icon">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="m10 6-6 6 6 6v-4h10v-4H10z"/></svg>
          <figcaption>brand:arrow-left</figcaption>
        </figure>

        <figure class="icon">
          <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M12 12a4 4 0 10-4-4 4 4 0 004 4m0 2c-4 0-8 2-8 4v2h16v-2c0-2-4-4-8-4"/></svg>
          <figcaption>brand:user</figcaption>
        </figure></div>
</body>
</html>
