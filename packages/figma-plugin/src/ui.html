<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        font:
          12px/1.4 Inter,
          system-ui,
          sans-serif;
        color: #1e1e1e;
      }
      body {
        margin: 12px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      label {
        display: grid;
        gap: 2px;
        margin-bottom: 8px;
      }
      input {
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        padding: 6px 10px;
        border: 0;
        border-radius: 6px;
        background: #0d99ff;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.secondary {
        background: #e6e6e6;
        color: #1e1e1e;
        margin-left: 6px;
      }
      ul {
        list-style: none;
        margin: 8px 0;
        padding: 0;
        max-height: 220px;
        overflow: auto;
      }
      li {
        display: grid;
        gap: 2px;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
      }
      li.err strong {
        color: #c00;
      }
      #status {
        margin: 8px 0;
        color: #555;
        word-break: break-all;
      }
      #status.err {
        color: #c00;
      }
      #status.ok {
        color: #1b7f37;
      }
      .row {
        display: flex;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>iconctl</h1>
    <label
      >Connection mode<select id="mode">
        <option value="console">Private console</option>
        <option value="github">GitHub dispatch (legacy)</option>
      </select></label
    >
    <section id="console-fields">
      <label>Console URL<input id="origin" value="https://iconctl.icebreaker.top" /></label>
      <button id="connect" type="button">Connect console</button
      ><button id="disconnect" class="secondary" type="button">Disconnect</button>
      <p id="console-status">Connect to receive a short-lived pairing code.</p>
    </section>
    <section id="github-fields" hidden>
      <label>GitHub repo<input id="repo" placeholder="owner/repo" /></label>
      <label
        >GitHub token (Contents: read and write)<input id="token" type="password" placeholder="github_pat_…"
      /></label>
      <label>Event type<input id="event" value="iconctl-publish" /></label>
    </section>
    <p id="status">Scanning this page…</p>
    <ul id="list"></ul>
    <div class="row">
      <button id="publish" disabled>Sync to console</button>
      <button id="rescan" class="secondary" type="button">Rescan</button>
    </div>
    <script src="./ui.js"></script>
  </body>
</html>
