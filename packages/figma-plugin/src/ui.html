<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        font:
          12px/1.4 Inter,
          system-ui,
          sans-serif;
        color: #1e1e1e;
      }
      body {
        margin: 12px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      label {
        display: grid;
        gap: 2px;
        margin-bottom: 8px;
      }
      input {
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        padding: 6px 10px;
        border: 0;
        border-radius: 6px;
        background: #0d99ff;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.secondary {
        background: #e6e6e6;
        color: #1e1e1e;
        margin-left: 6px;
      }
      ul {
        list-style: none;
        margin: 8px 0;
        padding: 0;
        max-height: 220px;
        overflow: auto;
      }
      li {
        display: grid;
        gap: 2px;
        padding: 6px 0;
        border-bottom: 1px solid #eee;
      }
      li .locate {
        justify-self: start;
        margin: 2px 0 0;
        padding: 3px 8px;
      }
      li.err strong {
        color: #c00;
      }
      #status {
        margin: 8px 0;
        color: #555;
        word-break: break-all;
      }
      #status.err {
        color: #c00;
      }
      #status.ok {
        color: #1b7f37;
      }
      #navigation-status,
      #report-status {
        margin: 4px 0;
        overflow-wrap: anywhere;
      }
      #navigation-status.err,
      #report-status.err {
        color: #c00;
      }
      #navigation-status.ok,
      #report-status.ok {
        color: #1b7f37;
      }
      .view-options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .view-options label {
        display: flex;
        align-items: center;
        margin: 0;
        gap: 4px;
      }
      .storage-feedback {
        color: #a33;
        overflow-wrap: anywhere;
        margin: 8px 0;
      }
      .storage-feedback button {
        margin: 4px 0 0;
      }
      #view-count,
      #empty-view {
        color: #555;
        margin: 6px 0;
      }
      .row {
        display: flex;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>iconctl</h1>
    <label
      >Connection mode<select id="mode">
        <option value="console">Private console</option>
        <option value="github">GitHub dispatch (legacy)</option>
      </select></label
    >
    <section id="console-fields">
      <label>Console URL<input id="origin" value="https://iconctl.icebreaker.top" /></label>
      <button id="connect" type="button">Connect console</button
      ><button id="disconnect" class="secondary" type="button">Disconnect</button>
      <p id="console-status">Connect to receive a short-lived pairing code.</p>
    </section>
    <section id="github-fields" hidden>
      <label>GitHub repo<input id="repo" placeholder="owner/repo" /></label>
      <label
        >GitHub token (Contents: read and write)<input id="token" type="password" placeholder="github_pat_…"
      /></label>
      <label>Event type<input id="event" value="iconctl-publish" /></label>
      <div id="settings-feedback" class="storage-feedback" hidden>
        <p id="settings-storage-status" aria-live="polite"></p>
        <button id="retry-settings" class="secondary" type="button">Retry settings storage</button>
      </div>
    </section>
    <p id="status">Scanning this page…</p>
    <label>Search preflight<input id="search" type="search" placeholder="Name or issue" /></label>
    <div class="view-options">
      <label><input id="problems-only" type="checkbox" />Problems only</label>
      <button id="clear-filters" class="secondary" type="button">Clear filters</button>
    </div>
    <div id="preferences-feedback" class="storage-feedback" hidden>
      <p id="preferences-storage-status" aria-live="polite"></p>
      <button id="retry-preferences" class="secondary" type="button">Retry view storage</button>
    </div>
    <p id="view-count" aria-live="polite"></p>
    <p id="empty-view" hidden></p>
    <ul id="list"></ul>
    <p id="navigation-status" role="status" aria-live="polite"></p>
    <button id="export-report" class="secondary" type="button" disabled>Export JSON report</button>
    <p id="report-status" aria-live="polite" aria-atomic="true">Rescan to prepare a complete report.</p>
    <div class="row">
      <button id="publish" disabled>Sync to console</button>
      <button id="rescan" class="secondary" type="button">Rescan</button>
    </div>
    <script src="./ui.js"></script>
  </body>
</html>
