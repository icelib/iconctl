name: iconctl
description: Load icons from Figma, SVG directories, and more, then export Iconify JSON
author: ice breaker
branding:
  icon: triangle
  color: gray-dark
inputs:
  token:
    description: Figma personal access token. Required when a Figma source is configured.
    required: false
    default: ''
  mastergo-token:
    description: MasterGo personal access token. Required when a MasterGo source is configured.
    required: false
    default: ''
  commit:
    description: Commit changed files back to the current branch
    required: false
    default: 'false'
  pr:
    description: Open a pull request with changed files instead of committing to the current branch
    required: false
    default: 'false'
  config:
    description: Optional path to iconctl.config.ts
    required: false
    default: ''
  paths:
    description: Git paths to stage (space-separated). Empty means all changes.
    required: false
    default: ''
  changeset:
    description: Write a patch changeset when the icon diff is non-empty
    required: false
    default: 'false'
  changeset-package:
    description: Package name for the generated changeset (required when changeset is true)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Sync icons
      shell: bash
      env:
        FIGMA_TOKEN: ${{ inputs.token }}
        MASTERGO_TOKEN: ${{ inputs.mastergo-token }}
      run: |
        extra=()
        if [ -n "${{ inputs.config }}" ]; then
          extra+=(--config "${{ inputs.config }}")
        fi
        npx --yes iconctl sync --json "${extra[@]}" | tee /tmp/iconctl-sync.json
    - name: Write changeset
      if: ${{ inputs.changeset == 'true' }}
      shell: bash
      run: |
        pkg="${{ inputs.changeset-package }}"
        if [ -z "$pkg" ]; then
          echo "changeset-package is required when changeset is true"
          exit 1
        fi
        if [ ! -f /tmp/iconctl-sync.json ] || ! command -v jq >/dev/null; then
          echo "No sync JSON; skipping changeset"
          exit 0
        fi
        if [ "$(jq -r '((.added // []) + (.removed // []) + (.changed // [])) | length' /tmp/iconctl-sync.json)" = "0" ]; then
          echo "No icon diff; skipping changeset"
          exit 0
        fi
        mkdir -p .changeset
        printf '%s\n' '---' "\"${pkg}\": patch" '---' '' 'Sync icons from iconctl.' > ".changeset/icons-${GITHUB_RUN_ID:-local}.md"
    - name: Commit changes
      if: ${{ inputs.commit == 'true' && inputs.pr != 'true' }}
      shell: bash
      run: |
        if [ -n "${{ inputs.paths }}" ]; then
          git add ${{ inputs.paths }}
        else
          git add -A
        fi
        if git diff --cached --quiet; then
          echo "No icon changes"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "chore: sync icons"
        git push
    - name: Open pull request
      if: ${{ inputs.pr == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -n "${{ inputs.paths }}" ]; then
          git add ${{ inputs.paths }}
        else
          git add -A
        fi
        if git diff --cached --quiet; then
          echo "No icon changes"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        branch="iconctl/sync-${GITHUB_RUN_ID}"
        git checkout -b "$branch"
        git commit -m "chore: sync icons"
        git push -u origin "$branch"
        body="Automated icon sync from iconctl (${GITHUB_EVENT_NAME})."
        if [ -f /tmp/iconctl-sync.json ] && command -v jq >/dev/null; then
          body=$(jq -r '
            "## iconctl sync\n\n"
            + "- prefix: `\(.prefix)`\n"
            + "- added: " + ((.added // []) | join(", ")) + "\n"
            + "- removed: " + ((.removed // []) | join(", ")) + "\n"
            + "- changed: " + ((.changed // []) | join(", ")) + "\n"
          ' /tmp/iconctl-sync.json)
        fi
        gh pr create --title "chore: sync icons" --body "$body"
