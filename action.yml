name: iconctl
description: Load icons from Figma, SVG directories, and more, then export Iconify JSON
author: ice breaker
branding:
  icon: triangle
  color: gray-dark
inputs:
  token:
    description: Figma personal access token. Required when a Figma source is configured.
    required: false
    default: ''
  mastergo-token:
    description: MasterGo personal access token. Required when a MasterGo source is configured.
    required: false
    default: ''
  commit:
    description: Commit changed files back to the current branch
    required: false
    default: 'false'
  pr:
    description: Open a pull request with changed files instead of committing to the current branch
    required: false
    default: 'false'
  config:
    description: Optional path to iconctl.config.ts
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Sync icons
      shell: bash
      env:
        FIGMA_TOKEN: ${{ inputs.token }}
        MASTERGO_TOKEN: ${{ inputs.mastergo-token }}
      run: |
        extra=()
        if [ -n "${{ inputs.config }}" ]; then
          extra+=(--config "${{ inputs.config }}")
        fi
        npx --yes iconctl sync --json "${extra[@]}"
    - name: Commit changes
      if: ${{ inputs.commit == 'true' && inputs.pr != 'true' }}
      shell: bash
      run: |
        git add -A
        if git diff --cached --quiet; then
          echo "No icon changes"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "chore: sync icons"
        git push
    - name: Open pull request
      if: ${{ inputs.pr == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git add -A
        if git diff --cached --quiet; then
          echo "No icon changes"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        branch="iconctl/sync-${GITHUB_RUN_ID}"
        git checkout -b "$branch"
        git commit -m "chore: sync icons"
        git push -u origin "$branch"
        gh pr create --title "chore: sync icons" --body "Automated icon sync from iconctl (${GITHUB_EVENT_NAME})."
